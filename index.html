<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>又松大学 3D 校园预览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap">
<style>
/* VOICE: friendly, clear campus welcome for prospective international students
   IDEA: the official illustrated campus map, lifted off the paper into a living 3D model with 솔이 as guide
   PICTURE: live 3D campus, map-style numbered badges, 솔이 walking the arrival route
   COLOUR and TYPE: Woosong crimson band, map-paper grey ground, orange/blue/purple map badges; Noto Sans SC/KR + Barlow Condensed codes
   LAYOUT: crimson header with language switch, stat strip, big stage with toolbar; card + tabbed list below (beside on wide screens) */
:root{color-scheme:light dark;--bg:light-dark(#eeece8,#141116);--panel:light-dark(#ffffff,#1e1a21);--ink:light-dark(#1d1a1f,#efeaf0);--mute:light-dark(#6b6670,#a49ca8);--line:light-dark(#dedad4,#332c37);--soft:light-dark(#f5f3ef,#262029);--red:#b8243f;--or:#f26b1d;--bl:#1f6fc0;--pu:#8e3a8e;--gt:#222;--gr:#2e9e4f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans SC","Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
:lang(ko) body,body:lang(ko){font-family:"Noto Sans KR","Noto Sans SC",system-ui,sans-serif}
header{background:var(--red);color:#fff;padding:16px max(4vw,16px) 14px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
header h1{margin:0;font-size:clamp(24px,5vw,36px);line-height:1.05;font-weight:900;text-wrap:balance}
header p{margin:6px 0 0;font-size:14px;opacity:.9}
.lang{display:flex;border:1px solid #fff8;border-radius:999px;overflow:hidden;flex:none}
.lang button{font:inherit;font-size:14px;min-height:40px;padding:0 13px;border:0;background:transparent;color:#fff;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:var(--red);font-weight:700}
.stats{display:flex;gap:8px;overflow-x:auto;padding:12px max(4vw,16px);scrollbar-width:none}
.stats span{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.stats b{font-family:"Barlow Condensed",sans-serif;font-size:18px;margin-right:4px;color:var(--red)}
main{display:grid;gap:14px;padding:0 max(4vw,16px) 28px}
@media(max-width:899px){#list{max-height:60vh;overflow:auto}}@media(min-width:900px){main{grid-template-columns:minmax(0,1fr) 380px;align-items:start}aside{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}#list{flex:1;overflow:auto}}
.stage{position:relative;height:clamp(420px,66vh,780px);border-radius:16px;overflow:hidden;background:#e9e7e3;border:1px solid var(--line);touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.tag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;border:2px solid #fff;color:#fff;font:700 13px/1 "Barlow Condensed","Noto Sans SC",sans-serif;min-width:30px;height:30px;padding:0 6px;border-radius:999px;display:grid;place-items:center;box-shadow:0 2px 6px #0004;transition:opacity .2s;will-change:transform;white-space:nowrap}
.tag.edu,.tag.life{background:var(--or)}.tag.dorm{background:var(--bl)}.tag.ext{background:var(--pu)}.tag.gate{background:var(--gt);font-size:12px}.tag.me{background:#1a73e8;pointer-events:none}
.tag.on{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--red);z-index:999999!important}
.tag.off{opacity:0;pointer-events:none}
.tag.step{background:var(--red)}
.bubble{position:absolute;left:0;top:0;max-width:min(280px,70vw);background:#fff;color:#1d1a1f;border:2px solid var(--gr);border-radius:14px;padding:8px 12px;font-size:14px;line-height:1.45;box-shadow:0 4px 14px #0003;pointer-events:none;opacity:0;transition:opacity .25s;z-index:999998}
.bubble.show{opacity:1}
.bubble b{color:var(--gr)}
.ctl{position:absolute;display:flex;gap:6px;z-index:2;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px}
.ctl.tl{top:8px;left:8px;right:8px}.ctl.bar{left:8px;right:8px;bottom:8px}
.ctl button{flex:none;font:inherit;font-size:14px;min-height:40px;padding:0 13px;border-radius:999px;border:1px solid #0002;background:#fffffff0;color:#1d1a1f;cursor:pointer;box-shadow:0 1px 4px #0002;white-space:nowrap}
.ctl button[aria-pressed=true]{background:var(--red);color:#fff;border-color:var(--red)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.hint{position:absolute;left:10px;bottom:58px;font-size:12px;color:#55505a;background:#ffffffd0;padding:4px 9px;border-radius:8px;z-index:2}
.toast{position:absolute;left:50%;top:58px;transform:translateX(-50%);background:#1d1a1fe6;color:#fff;font-size:14px;padding:8px 14px;border-radius:10px;z-index:3;max-width:86%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
#err{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:#55505a}
.card{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:150px}
.card .row{display:flex;align-items:center;gap:10px}
.code{font:700 18px/1 "Barlow Condensed","Noto Sans SC",sans-serif;color:#fff;border-radius:999px;padding:7px 11px;flex:none;white-space:nowrap}
.code.edu,.code.life{background:var(--or)}.code.dorm{background:var(--bl)}.code.ext{background:var(--pu)}.code.gate{background:var(--gt)}.code.step{background:var(--red)}
.card h2{margin:0;font-size:23px;line-height:1.15}
.card .alt{margin:4px 0 0;color:var(--mute);font-size:14px}
.kind{display:inline-block;margin-top:10px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--mute)}
.card p.d{margin:8px 0 0}
.card h3{margin:14px 0 6px;font-size:14px;color:var(--mute);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.chips span.hl{background:var(--red);color:#fff;border-color:var(--red)}
.empty{color:var(--mute);margin:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acts a,.acts button{font:inherit;font-size:14px;min-height:44px;display:inline-flex;align-items:center;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
.acts .pri{background:var(--red);color:#fff;border-color:var(--red)}
.steps{display:flex;gap:4px;margin-top:10px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--red)}
.tabs{display:flex;gap:4px;margin-top:14px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;font:inherit;font-size:14px;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--ink);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--panel);font-weight:700;box-shadow:0 1px 3px #0002}
.find{margin-top:10px}
.find input{width:100%;font:inherit;font-size:16px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.ftypes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ftypes button{font:inherit;font-size:13px;min-height:36px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.ftypes button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;min-height:44px;padding:6px 10px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink);cursor:pointer}
.item:hover,.item.on{background:var(--panel);border-color:var(--line)}
.item .code{font-size:13px;padding:5px 8px;min-width:40px;text-align:center}
.item small{color:var(--mute);margin-left:auto;white-space:nowrap;font-size:13px;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.note{font-size:13px;color:var(--mute);margin:12px 0 0}
.bus{margin:12px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.bus h3{margin:0 0 6px}.bus p{margin:4px 0;font-size:14px}.bus .ln{display:inline-block;min-width:38px;text-align:center;font-weight:700;color:#fff;background:#2e6fd1;border-radius:6px;padding:1px 7px;margin:0 4px 4px 0;font-size:13px}.bus .ln.g{background:#2e9e4f}.bus .tipx{border-left:3px solid var(--red);padding-left:8px}
.ph{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:12px;scrollbar-width:thin}
.ph figure{margin:0;flex:0 0 100%;scroll-snap-align:start}.ph img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;display:block;background:var(--soft)}
.ph figcaption{font-size:12px;color:var(--mute);margin-top:4px}
.fl{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--soft)}.fl summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;font-size:14px}
.fl ul{list-style:none;margin:0;padding:0 0 4px;display:grid;gap:6px;font-size:14px}.fl li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px}.fl li b{font-family:"Barlow Condensed",sans-serif;color:var(--red)}.fl small{color:var(--mute);white-space:nowrap;font-size:12px}
.nophoto{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);margin:10px 0 0}.nophoto svg{width:16px;height:16px;flex:none}
#logo{height:30px;width:auto;margin-bottom:10px;display:block}
.cap{position:absolute;left:10px;top:58px;z-index:2;max-width:min(380px,calc(100% - 80px));display:flex;gap:10px;align-items:flex-start;background:#fffffff2;color:#1d1a1f;border-radius:14px;padding:10px 12px;box-shadow:0 4px 14px #0002;font-size:14px;line-height:1.5;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s;pointer-events:none}
.cap.show{opacity:1;transform:none}.cap i{flex:none;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#3fb862,#2e9e4f 60%,#1f7a3b);box-shadow:inset 0 -3px 0 #c8102e}.cap b{color:var(--gr)}
@media(max-width:600px){.cap{top:auto;bottom:58px;right:10px;max-width:none}}
.tip{position:absolute;left:0;top:0;z-index:3;background:#1d1a1fe8;color:#fff;font-size:13px;padding:5px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap}.tip.show{opacity:1}
.compass{position:absolute;right:10px;top:58px;width:44px;height:44px;z-index:2;background:#ffffffe6;border-radius:999px;box-shadow:0 1px 4px #0003;display:grid;place-items:center}
.compass svg{width:36px;height:36px;transition:transform .1s linear}.compass .n{fill:var(--red)}.compass .s{fill:#b9b4bd}.compass text{font:700 9px "Barlow Condensed",sans-serif;fill:#1d1a1f}
.load{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:#e9e7e3;transition:opacity .7s;text-align:center;color:#55505a}
.load.done{opacity:0;pointer-events:none}.load b{display:block;font-size:18px;color:var(--red);margin-bottom:10px}
.load i{display:block;width:160px;height:4px;border-radius:2px;background:#0001;overflow:hidden;margin:auto;position:relative}.load i::after{content:"";position:absolute;inset:0;width:40%;background:var(--red);border-radius:2px;animation:ld 1.1s ease-in-out infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:50;padding:16px}
.modal.open{display:grid}
.sheet{background:var(--panel);color:var(--ink);border-radius:18px;width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px;position:relative}
.sheet h2{margin:0 44px 4px 0;font-size:22px;line-height:1.2}
.close{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:22px;cursor:pointer}
.room{position:relative;height:clamp(240px,42vh,380px);border-radius:12px;overflow:hidden;background:#f2efe9;margin-top:10px}
.room canvas{display:block;width:100%;height:100%}
.room small{position:absolute;left:8px;bottom:8px;font-size:12px;background:#ffffffd8;color:#55505a;padding:3px 8px;border-radius:6px}
.sheet ul{margin:10px 0 0;padding-left:20px}
.share{display:grid;gap:14px;grid-template-columns:180px minmax(0,1fr);align-items:start;margin-top:10px}
#qr{width:180px;min-height:180px;background:#fff;color:#1d1a1f;padding:10px;border-radius:10px;border:1px solid var(--line);font-size:12px;word-break:break-all}
#qr img,#qr canvas{width:100%!important;height:auto!important}
.share label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
.share input,.share textarea{width:100%;font:13px/1.4 ui-monospace,Menlo,monospace;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.share input{font-size:16px;min-height:44px}
.share textarea{height:96px;resize:vertical}
@media(max-width:600px){.hint{display:none}.tag{min-width:26px;height:26px;font-size:12px;padding:0 5px}.ctl button{font-size:13px;padding:0 11px}.share{grid-template-columns:minmax(0,1fr)}#qr{margin:auto}}
@media(prefers-reduced-motion:reduce){.tag,.bubble,.toast{transition:none}.load i::after{animation:none}}
</style>

<body>
<header>
  <div><img id="logo" alt="" hidden><h1 data-i="title">又松大学 3D 校园预览</h1><p data-i="sub"></p></div>
  <div class="lang" role="group" aria-label="Language" id="lang"><button data-l="zh">中文</button><button data-l="ko">한국어</button><button data-l="en">EN</button></div>
</header>
<div class="stats" id="stats"></div>
<main>
  <section class="stage" id="stage" aria-label="3D campus">
    <div id="tags"></div>
    <div class="ctl tl" id="filters" role="group"></div>
    <div class="ctl bar" id="bar">
      <button id="bTour"></button><button id="bRoute"></button><button id="bSeason"></button><button id="bFx"></button><button id="bNight"></button><button id="bView"></button><button id="bLoc"></button><button id="bShare"></button><button id="bReset"></button>
    </div>
    <div class="hint" data-i="hint"></div>
    <div class="compass" aria-hidden="true"><svg viewBox="0 0 40 40" id="compassSvg"><circle cx="20" cy="20" r="18" fill="none" stroke="#0002"/><path class="n" d="M20 6 L24.5 20 L15.5 20Z"/><path class="s" d="M20 34 L24.5 20 L15.5 20Z"/><text x="20" y="5.5" text-anchor="middle">N</text></svg></div>
    <div class="load" id="load"><div><b data-i="title"></b><i></i></div></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="cap" id="cap" aria-live="polite"><i aria-hidden="true"></i><div id="capT"></div></div>
    <div id="err" data-i="err"></div>
  </section>
  <aside>
    <div class="card" id="card" aria-live="polite"></div>
    <div class="tabs" role="group" id="tabs"><button data-t="b"></button><button data-t="m"></button><button data-t="f"></button></div>
    <div class="ftypes" id="ftypes" hidden></div>
    <div class="find"><input id="q" type="search" autocomplete="off"></div>
    <ul id="list"></ul>
    <p class="note" data-i="note"></p>
  </aside>
</main>
<div class="modal" id="mRoom" role="dialog" aria-modal="true" aria-labelledby="roomT"><div class="sheet">
  <button class="close" data-close aria-label="Close">×</button>
  <h2 id="roomT"></h2><div class="ftypes" id="roomTypes"></div>
  <div class="room" id="roomStage"><small data-i="roomNote"></small></div>
  <ul id="roomFacts"></ul><p class="note" data-i="dormSrc"></p>
</div></div>
<div class="modal" id="mShare" role="dialog" aria-modal="true" aria-labelledby="shareT"><div class="sheet">
  <button class="close" data-close aria-label="Close">×</button>
  <h2 id="shareT" data-i="shareT"></h2><p class="note" id="shareFor" style="margin-top:0"></p>
  <div class="share"><div id="qr"></div><div>
    <label for="baseUrl" data-i="baseUrl"></label><input id="baseUrl">
    <div class="acts" style="margin-top:8px"><button id="cpLink" class="pri" data-i="copyLink"></button></div>
    <label for="embed" style="margin-top:14px" data-i="embedL"></label><textarea id="embed" readonly></textarea>
    <div class="acts" style="margin-top:8px"><button id="cpEmbed" data-i="copyEmbed"></button></div>
  </div></div>
  <p class="note" data-i="shareNote"></p>
</div></div>
<script>setTimeout(()=>{if(!window.__ok){document.getElementById('err').style.display='grid'}},15000)</script>
